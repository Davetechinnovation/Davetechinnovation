name: Generate Snake Animation

on:
  schedule:
    - cron: "17 3 * * *" # daily, off-peak to avoid GitHub's busiest time
  workflow_dispatch: # allows manual runs from the Actions tab
  push:
    branches:
      - main

# Required: lets the GITHUB_TOKEN push to the output branch
# (newer repos default to a read-only token, which breaks the push step)
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Davetechinnovation
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
